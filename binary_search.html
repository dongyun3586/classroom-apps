<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이분 탐색 시각화 (Binary Search Visualizer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .array-cell {
            transition: all 0.3s ease;
        }
        .pointer {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 text-white p-6">
            <h1 class="text-3xl font-bold mb-2">이분 탐색 시각화 도구</h1>
            <p class="text-blue-100">중복된 값이 포함된 정렬된 배열에서 이분 탐색이 어떻게 동작하는지 단계별로 확인해보세요.</p>
        </div>

        <div class="p-6 border-b border-slate-200 bg-slate-50 flex flex-wrap gap-6 items-end">
            <div>
                <button id="generateBtn" class="bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors shadow-sm">
                    새로운 배열 생성
                </button>
            </div>
            
            <div class="flex-grow flex flex-wrap gap-4 items-end">
                <div class="flex flex-col">
                    <label for="targetInput" class="text-sm font-semibold text-slate-600 mb-1">찾을 값 (1-10)</label>
                    <input type="number" id="targetInput" min="1" max="10" value="5" class="border border-slate-300 rounded-lg px-3 py-2 w-24 text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-600 mb-1">탐색 알고리즘 선택</label>
                    <div class="flex bg-white border border-slate-300 rounded-lg overflow-hidden text-sm">
                        <label class="flex items-center px-3 py-2 cursor-pointer hover:bg-slate-50 border-r border-slate-300">
                            <input type="radio" name="searchType" value="basic" class="mr-1.5 text-blue-600 focus:ring-blue-500">
                            발견 즉시 반환
                        </label>
                        <label class="flex items-center px-3 py-2 cursor-pointer hover:bg-slate-50 border-r border-slate-300">
                            <input type="radio" name="searchType" value="left" checked class="mr-1.5 text-blue-600 focus:ring-blue-500">
                            가장 왼쪽
                        </label>
                        <label class="flex items-center px-3 py-2 cursor-pointer hover:bg-slate-50">
                            <input type="radio" name="searchType" value="right" class="mr-1.5 text-blue-600 focus:ring-blue-500">
                            가장 오른쪽
                        </label>
                    </div>
                </div>

                <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors shadow-sm ml-auto">
                    탐색 시작
                </button>
            </div>
        </div>

        <div id="alertBox" class="hidden mx-6 mt-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" id="alertMsg"></span>
        </div>

        <div class="p-8">
            <div class="flex flex-col gap-8">
                <!-- Top Section: Array Visualization -->
                <div class="w-full flex flex-col">
                    <!-- 추가된 변수 추적 패널 -->
                    <div id="variableState" class="flex flex-wrap justify-center gap-3 mt-4 hidden">
                        <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full text-sm font-mono font-semibold border border-blue-200">left: <span id="varL" class="text-base">-</span></span>
                        <span class="bg-red-50 text-red-700 px-3 py-1.5 rounded-full text-sm font-mono font-semibold border border-red-200">right: <span id="varR" class="text-base">-</span></span>
                        <span class="bg-yellow-50 text-yellow-700 px-3 py-1.5 rounded-full text-sm font-mono font-semibold border border-yellow-300">mid: <span id="varM" class="text-base">-</span></span>
                        <span class="bg-green-100 text-green-800 px-4 py-1.5 rounded-full text-sm font-mono font-bold border border-green-300 shadow-sm ring-2 ring-green-100">result: <span id="varResult" class="text-base">-1</span></span>
                    </div>

                    <div class="relative w-full overflow-x-auto pb-16 pt-12 flex-grow">
                        <div id="arrayContainer" class="flex justify-center gap-2 md:gap-4 min-w-max mx-auto relative">
                            <!-- 배열 요소가 JS로 생성됨 -->
                        </div>
                    </div>

                    <div id="stepControls" class="mt-2 flex justify-center gap-4 hidden">
                        <button id="prevBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 px-6 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            &larr; 이전 단계
                        </button>
                        <div class="flex items-center px-4 font-semibold text-slate-500">
                            단계: <span id="stepCounter" class="text-slate-800 ml-1">0 / 0</span>
                        </div>
                        <button id="nextBtn" class="bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-2 px-6 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            다음 단계 &rarr;
                        </button>
                    </div>

                    <div class="mt-6 bg-blue-50 border border-blue-100 rounded-xl p-6 min-h-[100px] flex items-center justify-center">
                        <p id="logText" class="text-base text-slate-700 font-medium text-center leading-relaxed">
                            '새로운 배열 생성' 버튼을 눌러 배열을 초기화하고 탐색을 시작하세요.
                        </p>
                    </div>
                </div>

                <!-- Bottom Section: Python Code -->
                <div class="w-full bg-[#1e293b] rounded-xl shadow-lg flex flex-col overflow-hidden">
                    <div class="bg-slate-800 px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                        <span class="text-slate-200 font-semibold text-sm">Python Source Code</span>
                        <span class="text-xs text-slate-400 bg-slate-700 px-2 py-1 rounded">line by line</span>
                    </div>
                    <div id="codeContainer" class="p-4 text-sm font-mono text-slate-300 overflow-x-auto flex-grow flex flex-col gap-0.5 min-h-[300px]">
                        <!-- Python Code Lines generated by JS -->
                        <div class="text-slate-500 text-center mt-10 italic">탐색을 시작하면 코드가 표시됩니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let array = [];
        let steps = [];
        let currentStepIndex = 0;
        let isSearching = false;

        // DOM 요소 가져오기
        const arrayContainer = document.getElementById('arrayContainer');
        const generateBtn = document.getElementById('generateBtn');
        const startBtn = document.getElementById('startBtn');
        const targetInput = document.getElementById('targetInput');
        const searchTypeRadios = document.getElementsByName('searchType');
        const alertBox = document.getElementById('alertBox');
        const alertMsg = document.getElementById('alertMsg');
        const logText = document.getElementById('logText');
        const stepControls = document.getElementById('stepControls');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const stepCounter = document.getElementById('stepCounter');
        const codeContainer = document.getElementById('codeContainer');

        const variableState = document.getElementById('variableState');
        const varL = document.getElementById('varL');
        const varR = document.getElementById('varR');
        const varM = document.getElementById('varM');
        const varResult = document.getElementById('varResult');

        const basicCodeLines = [
            "def binary_search(arr, target):",
            "    left, right = 0, len(arr) - 1",
            "    while left <= right:",
            "        mid = (left + right) // 2",
            "        if arr[mid] == target:",
            "            return mid",
            "        else:",
            "            if arr[mid] < target:",
            "                left = mid + 1",
            "            else:",
            "                right = mid - 1",
            "    return -1"
        ];

        const leftCodeLines = [
            "def binary_search_left(arr, target):",
            "    left, right = 0, len(arr) - 1",
            "    result = -1",
            "    while left <= right:",
            "        mid = (left + right) // 2",
            "        if arr[mid] == target:",
            "            result = mid",
            "            right = mid - 1",
            "        else:",
            "            if arr[mid] < target:",
            "                left = mid + 1",
            "            else:",
            "                right = mid - 1",
            "    return result"
        ];

        const rightCodeLines = [
            "def binary_search_right(arr, target):",
            "    left, right = 0, len(arr) - 1",
            "    result = -1",
            "    while left <= right:",
            "        mid = (left + right) // 2",
            "        if arr[mid] == target:",
            "            result = mid",
            "            left = mid + 1",
            "        else:",
            "            if arr[mid] < target:",
            "                left = mid + 1",
            "            else:",
            "                right = mid - 1",
            "    return result"
        ];

        function renderCode(type) {
            let lines;
            if (type === 'basic') lines = basicCodeLines;
            else if (type === 'left') lines = leftCodeLines;
            else lines = rightCodeLines;
            
            codeContainer.innerHTML = '';
            lines.forEach((line, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.id = `code-line-${index}`;
                lineDiv.className = 'px-2 py-0.5 rounded border border-transparent whitespace-pre transition-colors duration-200';
                lineDiv.textContent = line;
                codeContainer.appendChild(lineDiv);
            });
        }

        function highlightCodeLine(lineIndex) {
            if (lineIndex === null || lineIndex === undefined) return;
            for(let i=0; i<15; i++) {
                const el = document.getElementById(`code-line-${i}`);
                if (el) {
                    el.classList.remove('bg-blue-600/50', 'border-blue-500', 'text-white');
                    el.classList.add('border-transparent');
                }
            }
            const targetEl = document.getElementById(`code-line-${lineIndex}`);
            if (targetEl) {
                targetEl.classList.remove('border-transparent');
                targetEl.classList.add('bg-blue-600/50', 'border-blue-500', 'text-white');
            }
        }

        function generateRandomSortedArray() {
            array = [];
            for (let i = 0; i < 10; i++) {
                // 1부터 10 사이의 랜덤 숫자 생성 (중복 허용)
                array.push(Math.floor(Math.random() * 10) + 1);
            }
            // 이분 탐색을 위해 오름차순 정렬
            array.sort((a, b) => a - b);
            
            isSearching = false;
            steps = [];
            currentStepIndex = 0;
            hideAlert();
            stepControls.classList.add('hidden');
            if (variableState) variableState.classList.add('hidden');
            logText.innerHTML = "새로운 배열이 생성되었습니다. 탐색할 값을 입력하고 <strong>탐색 시작</strong>을 누르세요.";
            
            if(typeof codeContainer !== 'undefined' && codeContainer) {
                codeContainer.innerHTML = '<div class="text-slate-500 text-center mt-10 italic">탐색을 시작하면 코드가 표시됩니다.</div>';
            }

            renderArray();
        }

        function renderArray(state = null) {
            arrayContainer.innerHTML = '';
            
            array.forEach((val, index) => {
                const cellWrapper = document.createElement('div');
                cellWrapper.className = 'flex flex-col items-center relative';

                // 인덱스 라벨
                const indexLabel = document.createElement('div');
                indexLabel.className = 'text-xs text-slate-400 mb-1 absolute -top-6';
                indexLabel.innerText = index;
                cellWrapper.appendChild(indexLabel);

                // 값 셀
                const cell = document.createElement('div');
                cell.className = `array-cell w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-2 rounded-lg text-xl md:text-2xl font-bold shadow-sm relative`;
                cell.innerText = val;

                if (!state) {
                    // 기본 상태
                    cell.classList.add('bg-white', 'border-slate-300', 'text-slate-800');
                } else {
                    const { l, r, mid, result, isFinal } = state;
                    
                    if (isFinal && index === result) {
                        // 최종 결과
                        cell.classList.add('bg-green-400', 'border-green-600', 'text-white', 'scale-110', 'z-10');
                    } else if (!isFinal && index === mid) {
                        // 중간값 (mid)
                        cell.classList.add('bg-yellow-300', 'border-yellow-500', 'text-slate-800', 'scale-105');
                    } else if (l !== null && r !== null && index >= l && index <= r) {
                        // 탐색 범위 안 (아직 확인하지 못한 영역)
                        cell.classList.add('bg-slate-50', 'border-slate-400', 'text-slate-700', 'border-dashed');
                        
                        // unknown 라벨 추가
                        const unknownLabel = document.createElement('div');
                        unknownLabel.className = 'text-[10px] font-bold text-slate-500 absolute -top-10 bg-slate-200 px-1.5 py-0.5 rounded-sm shadow-sm';
                        unknownLabel.innerText = 'unknown';
                        cellWrapper.appendChild(unknownLabel);
                    } else {
                        // 탐색 범위 밖 (무시됨)
                        cell.classList.add('bg-slate-100', 'border-slate-200', 'text-slate-300');
                    }
                }

                cellWrapper.appendChild(cell);

                // 포인터 라벨 (L, M, R) 추가
                if (state && !state.isFinal) {
                    const pointers = [];
                    if (index === state.l) pointers.push('<span class="text-blue-600">L</span>');
                    if (state.mid !== null && index === state.mid) pointers.push('<span class="text-yellow-600">M</span>');
                    if (index === state.r) pointers.push('<span class="text-red-500">R</span>');

                    if (pointers.length > 0) {
                        const pointerDiv = document.createElement('div');
                        pointerDiv.className = 'pointer absolute -bottom-8 text-sm font-bold flex gap-1';
                        pointerDiv.innerHTML = pointers.join(',');
                        cellWrapper.appendChild(pointerDiv);
                    }
                }

                arrayContainer.appendChild(cellWrapper);
            });
        }

        function simulateBinarySearch(target, type) {
            steps = [];
            let l = 0;
            let r = array.length - 1;
            let result = -1;

            const lineInit = type === 'basic' ? 1 : 1;
            const lineWhile = type === 'basic' ? 2 : 3;
            const lineMid = type === 'basic' ? 3 : 4;
            const lineReturn = type === 'basic' ? 11 : 13;

            // 1단계: left, right 초기화 상태
            steps.push({ l, r, mid: null, result: type === 'basic' ? '-' : result, isFinal: false, line: lineInit, msg: `<strong>초기 설정:</strong> 찾을 값은 ${target} 입니다.<br>탐색 범위는 인덱스 L(0) 부터 R(${r}) 까지입니다.` });

            while (l <= r) {
                let mid = Math.floor((l + r) / 2);
                
                // 2단계: M을 설정하는 단계
                steps.push({ l, r, mid, result: type === 'basic' ? '-' : result, isFinal: false, line: lineMid, msg: `<strong>중간 인덱스 M 계산:</strong> (L(${l}) + R(${r})) // 2 = ${mid}.<br>인덱스 ${mid}의 값은 <strong>${array[mid]}</strong> 입니다.` });

                let comparisonMsg = "";

                if (array[mid] === target) {
                    if (type === 'basic') {
                        result = mid;
                        steps.push({ l: null, r: null, mid: result, result, isFinal: true, line: 5, msg: `값이 일치합니다! 발견 즉시 해당 인덱스 <strong class="text-green-600">${result}</strong> 를 반환하고 탐색을 종료합니다.` });
                        break;
                    }

                    result = mid; 
                    if (type === 'left') {
                        r = mid - 1;
                        comparisonMsg = `값이 일치합니다! 임시 결과로 저장하고 가장 왼쪽 값을 찾기 위해 <strong>R 포인터를 ${r}</strong>로 이동합니다.`;
                    } else {
                        l = mid + 1;
                        comparisonMsg = `값이 일치합니다! 임시 결과로 저장하고 가장 오른쪽 값을 찾기 위해 <strong>L 포인터를 ${l}</strong>로 이동합니다.`;
                    }
                } else {
                    if (array[mid] < target) {
                        l = mid + 1;
                        comparisonMsg = `찾는 값(${target})이 더 크므로 <strong>L 포인터를 ${l}</strong>로 이동합니다.`;
                    } else {
                        r = mid - 1;
                        comparisonMsg = `찾는 값(${target})이 더 작으므로 <strong>R 포인터를 ${r}</strong>로 이동합니다.`;
                    }
                }

                // 3단계: 포인터 업데이트 후 while 문 조건 검사
                let conditionStatus = l <= r ? "계속 진행합니다." : "종료합니다.";
                steps.push({ l, r, mid: null, result: type === 'basic' ? '-' : result, isFinal: false, line: lineWhile, msg: `${comparisonMsg}<br><br><strong>while 문 조건 검사:</strong> L(${l}) <= R(${r}) 이므로 탐색을 ${conditionStatus}` });
            }

            // 최종 단계: return result
            if (result !== -1) {
                if (type !== 'basic') {
                    steps.push({ l: null, r: null, mid: result, result, isFinal: true, line: lineReturn, msg: `<strong>탐색 완료:</strong> 최종적으로 인덱스 <strong class="text-green-600">${result}</strong> 에서 값을 찾았습니다.` });
                }
            } else {
                steps.push({ l: null, r: null, mid: null, result: type === 'basic' ? '-1' : result, isFinal: true, line: lineReturn, msg: `<strong>탐색 완료:</strong> 배열에서 <strong class="text-red-500">${target}</strong> 을(를) 찾을 수 없습니다.` });
            }
        }

        function updateStepView() {
            const state = steps[currentStepIndex];
            renderArray(state);
            logText.innerHTML = state.msg;
            
            // 파이썬 코드 해당 라인 하이라이트
            highlightCodeLine(state.line);

            // 변수 상태 업데이트
            varL.innerText = state.l !== null ? state.l : '-';
            varR.innerText = state.r !== null ? state.r : '-';
            varM.innerText = state.mid !== null ? state.mid : '-';
            varResult.innerText = state.result !== null ? state.result : '-1';
            
            stepCounter.innerText = `${currentStepIndex + 1} / ${steps.length}`;
            prevBtn.disabled = currentStepIndex === 0;
            nextBtn.disabled = currentStepIndex === steps.length - 1;
        }

        function showAlert(msg) {
            alertMsg.innerText = msg;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        generateBtn.addEventListener('click', generateRandomSortedArray);

        startBtn.addEventListener('click', () => {
            const targetStr = targetInput.value;
            if (!targetStr || isNaN(targetStr)) {
                showAlert('올바른 숫자를 입력해주세요.');
                return;
            }
            
            const target = parseInt(targetStr);
            if (target < 1 || target > 10) {
                showAlert('1에서 10 사이의 숫자를 입력해주세요.');
                return;
            }

            hideAlert();
            
            let searchType = 'left';
            for (const radio of searchTypeRadios) {
                if (radio.checked) {
                    searchType = radio.value;
                    break;
                }
            }

            // 파이썬 코드 렌더링
            renderCode(searchType);

            simulateBinarySearch(target, searchType);
            isSearching = true;
            currentStepIndex = 0;
            stepControls.classList.remove('hidden');
            variableState.classList.remove('hidden');
            updateStepView();
        });

        prevBtn.addEventListener('click', () => {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateStepView();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentStepIndex < steps.length - 1) {
                currentStepIndex++;
                updateStepView();
            }
        });

        // 초기 실행
        generateRandomSortedArray();
    </script>
</body>
</html>
